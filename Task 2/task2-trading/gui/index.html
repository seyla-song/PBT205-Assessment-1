<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PBT205 Trading</title>
<style>
  :root{--bg:#f6f7f9;--card:#fff;--ink:#1c2230;--mut:#6b7385;--acc:#ff6900;--line:#e2e5ec;--up:#1a7f4b;--dn:#b3261e}
  *{box-sizing:border-box} body{margin:0;font:15px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--ink)}
  .wrap{max-width:900px;margin:0 auto;padding:16px} h1{font-size:20px;margin:8px 0 14px} h2{font-size:14px;color:var(--mut);margin:0 0 8px;text-transform:uppercase;letter-spacing:.04em}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
  .tiles{display:flex;gap:12px;flex-wrap:wrap} .tile{flex:1 1 180px;border:1px solid var(--line);border-radius:10px;padding:14px;background:#fff}
  .tile .s{font-weight:700;color:var(--mut)} .tile .p{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums} .tile .t{font-size:12px;color:var(--mut)}
  .up{color:var(--up)} .dn{color:var(--dn)} .none{color:var(--mut)}
  table{width:100%;border-collapse:collapse;font-size:14px} th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)} th{color:var(--mut);font-weight:600} td.n{font-variant-numeric:tabular-nums}
  .form{display:flex;gap:8px;flex-wrap:wrap;align-items:end} .form div{flex:1 1 110px} label{display:block;font-size:12px;color:var(--mut);margin-bottom:3px}
  input,select,button{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;width:100%} button{background:var(--acc);color:#fff;border:0;cursor:pointer}
  #err{color:var(--dn);font-size:13px;min-height:18px;margin-top:6px} .cols{display:grid;grid-template-columns:1fr 1fr;gap:14px} @media(max-width:700px){.cols{grid-template-columns:1fr}}
</style></head><body><div class="wrap">
<h1>PBT205 Trading — latest prices</h1>
<div class="card"><h2>Last price (from the 'trades' topic)</h2><div class="tiles" id="tiles"></div></div>
<div class="card"><h2>Place an order (quantity fixed at 100)</h2>
  <form class="form" id="f">
    <div><label>Trader</label><input id="user" maxlength="20" placeholder="alice" required></div>
    <div><label>Side</label><select id="side"><option>BUY</option><option>SELL</option></select></div>
    <div><label>Stock</label><input id="symbol" value="XYZ" maxlength="6" required></div>
    <div><label>Price</label><input id="price" type="number" step="0.01" min="0.01" placeholder="10.50" required></div>
    <div><button>Send order</button></div></form><div id="err"></div></div>
<div class="cols"><div class="card"><h2>Recent trades</h2><table><thead><tr><th>#</th><th>Stock</th><th>Price</th><th>Buyer</th><th>Seller</th></tr></thead><tbody id="tr"></tbody></table></div>
<div class="card"><h2>Recent orders</h2><table><thead><tr><th>Trader</th><th>Side</th><th>Stock</th><th>Price</th></tr></thead><tbody id="or"></tbody></table></div></div>
</div>
<script>
const $=(i)=>document.getElementById(i); let S={last:{},trades:[],orders:[],symbols:['XYZ']}; const prev={};
const esc=(s)=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function render(){
  $('tiles').innerHTML=S.symbols.map(s=>{const l=S.last[s];const cls=!l?'none':(prev[s]==null||l.price===prev[s]?'':l.price>prev[s]?'up':'dn');
    return `<div class="tile"><div class="s">${esc(s)}</div><div class="p ${cls||''} ${l?'':'none'}" id="last-${esc(s)}">Last price: ${l?l.price.toFixed(2):'—'}</div><div class="t">${l?'at '+new Date(l.ts).toLocaleTimeString():'no trades yet'}</div></div>`}).join('');
  $('tr').innerHTML=S.trades.map(t=>`<tr><td class="n">${t.tradeId}</td><td>${esc(t.symbol)}</td><td class="n">${t.price.toFixed(2)}</td><td>${esc(t.buyer)}</td><td>${esc(t.seller)}</td></tr>`).join('')||'<tr><td colspan=5 class="none">none yet</td></tr>';
  $('or').innerHTML=S.orders.map(o=>`<tr><td>${esc(o.user)}</td><td>${o.side}</td><td>${esc(o.symbol)}</td><td class="n">${o.price.toFixed(2)}</td></tr>`).join('')||'<tr><td colspan=4 class="none">none yet</td></tr>';
}
const es=new EventSource('/api/stream');
es.addEventListener('state',e=>{S=JSON.parse(e.data);render()});
es.addEventListener('trade',e=>{const t=JSON.parse(e.data);prev[t.symbol]=S.last[t.symbol]?S.last[t.symbol].price:null;S.last[t.symbol]={price:t.price,ts:t.ts};if(!S.symbols.includes(t.symbol))S.symbols.push(t.symbol);S.trades.unshift(t);S.trades.length=Math.min(S.trades.length,50);render()});
es.addEventListener('order',e=>{S.orders.unshift(JSON.parse(e.data));S.orders.length=Math.min(S.orders.length,50);render()});
$('f').onsubmit=async(e)=>{e.preventDefault();$('err').textContent='';
  const r=await fetch('/api/order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:$('user').value.trim(),side:$('side').value,symbol:$('symbol').value.trim(),price:$('price').value})});
  const j=await r.json();if(!r.ok)$('err').textContent=j.error};
render();
</script></body></html>
